# Proctoring pipeline configuration.

device:
  preference: auto    # 'cuda' | 'mps' | 'cpu' | 'auto'

models:
  detector_weights: models/yolo11l.pt
  pose_weights: models/yolo11m-pose.pt
  imgsz: 1280

# COCO class indices used as device classes.
device_classes:
  cell_phone: 67
  laptop: 63

person_class: 0

detection:
  # Detections below this never reach the aggregator. 0.15 admitted so much
  # junk that nearly every false positive in a run sat under 0.30, so the floor
  # is raised; the postprocess pass below then screens on the event mean.
  conf_threshold: 0.25
  iou_threshold: 0.5
  device_min_area_px: 50
  # Tiled inference: split frame into tiles_x * tiles_y tiles with overlap_frac
  # overlap. Improves small-object recall (phones in back rows). Set tiles_x = 1
  # to disable.
  tiles_x: 2
  tiles_y: 2
  tile_overlap_frac: 0.20

tracking:
  tracker: bytetrack.yaml
  persist: true

processing:
  # Process every Nth frame. With 30 fps source and stride=4, effective rate ~7.5 fps.
  frame_stride: 4

# Static-fixture filter: suppress device clusters that hit the same pixel location
# repeatedly (desk grommets, power outlets, etc.). Without this, the COCO model
# locks onto small static features and emits sustained false alarms.
fixture_filter:
  enabled: true
  cluster_radius_px: 18.0
  min_count_to_lock: 6
  min_lifetime_sec: 6.0

# Wrist-aware association: prefer the tracked person whose wrist is nearest to a
# device. Used as a confidence boost, not a hard filter, so a phone clearly on a
# desk is still detected even if the nearest hand is briefly out of frame.
association:
  wrist_max_dist_px: 250
  wrist_conf_min: 0.30
  body_max_dist_px: 400      # body-centre fallback when no wrist passes

# Chatting heuristic.
chatting:
  enabled: true
  # Centre-to-centre distance between two people, expressed in average shoulder
  # widths. ~2.5 shoulder-widths ≈ adjacent seats.
  proximity_max_shoulder_widths: 2.5
  # Head yaw, measured as how far the nose has slid along the shoulder axis,
  # in units of half a shoulder width. 0 is looking straight ahead, 1 puts the
  # nose over a shoulder. Both people must be turned toward each other by at
  # least this much. Raise it to demand a more deliberate turn.
  min_head_turn_ratio: 0.15
  min_pose_conf: 0.30
  # Frames a pair must hold the geometry before it counts, which drops
  # single-frame pose noise. Counted in sampled frames, not source frames.
  min_consecutive_frames: 2

# Per-subtype event aggregation. Per-frame booleans are merged into intervals;
# gaps shorter than gap_tolerance_sec are bridged, intervals shorter than
# min_duration_sec are dropped.
aggregation:
  gap_tolerance_sec:
    cell_phone: 1.5
    laptop: 2.5
    chatting: 1.5
  min_duration_sec:
    cell_phone: 1.5
    laptop: 3.0
    # Was 3.0, which a short clip cannot satisfy — a 3.3 s sample needed the
    # event to span 90% of the footage. The detector's own consecutive-frame
    # gate already screens single-frame noise, so this need not do it twice.
    chatting: 1.5

# Post-run screening, written to events_filtered.csv alongside the raw
# events.csv. Drops events whose mean confidence is below the per-subtype floor,
# then drops whole tracks that emit many events inside a tight spatial cluster
# (a "ghost" — a static region the detector keeps re-tagging).
postprocess:
  enabled: true
  # Swept against the sample clips: false positives landed at 0.30-0.37 while
  # genuine detections landed at 0.63-0.69. Results plateau from 0.40 up, so
  # this sits at the start of the plateau rather than tight against the data.
  min_mean_conf:
    cell_phone: 0.40
    laptop: 0.40
    chatting: 0.0     # chatting carries no detector score, so no floor applies
  ghost_max_span_px: 60.0
  ghost_max_events: 4
  # Same-subtype events closer together than this are treated as one incident
  # reported twice, which is what a track-ID reassignment produces.
  merge_bridge_sec: 1.0

output:
  events_filename: events.csv
  video_filename: annotated.mp4
  metrics_filename: metrics.json
  draw_overlay: true
